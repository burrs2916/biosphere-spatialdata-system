<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <!-- AI渐变 -->
    <linearGradient id="ai-gradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#534AB7;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1D9E75;stop-opacity:1" />
    </linearGradient>
    
    <!-- 阴影 -->
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#00000030"/>
    </filter>
  </defs>
  
  <!-- 背景圆 -->
  <circle cx="256" cy="256" r="240" fill="#F1EFE8"/>
  
  <!-- 主框架（圆角矩形） -->
  <rect x="106" y="156" width="300" height="200" rx="24" fill="white" filter="url(#shadow)"/>
  
  <!-- DWG文字底座（曲线圆角矩形） -->
  <rect x="156" y="286" width="200" height="40" rx="8" fill="#534AB7" opacity="0.95"/>
  <text x="256" y="313" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="24" fill="white">DWG</text>
  
  <!-- AI芯片/大脑符号（带曲线装饰） -->
  <g transform="translate(256, 230)">
    <!-- 主矩形 -->
    <rect x="-30" y="-30" width="60" height="60" rx="12" fill="url(#ai-gradient)"/>
    
    <!-- AI文字 -->
    <text x="0" y="-8" text-anchor="middle" font-family="Arial, sans-serif" font-weight="700" font-size="18" fill="white">AI</text>
    
    <!-- 曲线装饰（芯片电路风格） -->
    <path d="M-20 -15 Q-10 -25 0 -15 Q10 -5 20 -15" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
    <path d="M-20 5 Q-10 -5 0 5 Q10 15 20 5" fill="none" stroke="white" stroke-width="2" stroke-linecap="round"/>
    
    <!-- 角落装饰 -->
    <circle cx="-25" cy="-25" r="3" fill="white" opacity="0.8"/>
    <circle cx="25" cy="-25" r="3" fill="white" opacity="0.8"/>
    <circle cx="-25" cy="25" r="3" fill="white" opacity="0.8"/>
    <circle cx="25" cy="25" r="3" fill="white" opacity="0.8"/>
  </g>
  
  <!-- 视线符号（Viewer功能，带曲线） -->
  <g transform="translate(256, 346)">
    <!-- 左眼 -->
    <circle cx="-40" cy="0" r="8" fill="none" stroke="#1D9E75" stroke-width="3"/>
    <circle cx="-40" cy="0" r="3" fill="#1D9E75"/>
    
    <!-- 右眼 -->
    <circle cx="40" cy="0" r="8" fill="none" stroke="#1D9E75" stroke-width="3"/>
    <circle cx="40" cy="0" r="3" fill="#1D9E75"/>
    
    <!-- 视线曲线 -->
    <path d="M-56 0 Q-48 16 -40 0 Q-20 40 0 0 Q20 40 40 0 Q48 16 56 0" 
          fill="none" stroke="#1D9E75" stroke-width="3" stroke-linecap="round"/>
  </g>
  
  <!-- 装饰曲线（顶部） -->
  <path d="M156 156 Q256 136 356 156" fill="none" stroke="#534AB7" stroke-width="2" opacity="0.3"/>
</svg>